<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shamo - تفاصيل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0a0b12; color: #f3f4f6; margin: 0; padding: 16px; padding-bottom: 80px; font-family: sans-serif; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .icon-btn { background: #141721; border: 1px solid #232d42; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .manga-header { display: flex; gap: 16px; margin-bottom: 20px; }
    .manga-header img { width: 120px; height: 170px; border-radius: 14px; object-fit: cover; }
    .manga-info h1 { margin: 0; font-size: 1.5rem; }
    .desc-box { background: #141721; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #232d42; line-height: 1.6; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #090c12; border-top: 1px solid #232d42; display: flex; justify-content: space-around; align-items: center; }
    .nav-btn { text-decoration: none; color: #9ca3af; display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="icon-btn"><i class="fa-solid fa-arrow-right"></i></a>
    <div>تفاصيل المانجا</div>
    <div class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></div>
  </div>

  <div class="manga-header">
    <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400" alt="Cover">
    <div class="manga-info">
      <h1>Shamo</h1>
      <p style="color:#9ca3af; font-size: 0.9rem;">الفصل: 184 | مستمرة</p>
    </div>
  </div>

  <div class="desc-box">
    في سن يناهز السادسة عشرة، ريو ناروشيما، فتى ذكي لم يواجه أي مشكلة... هذه صفحة التفاصيل تعمل الآن بنجاح!
  </div>

  <div class="bottom-bar">
    <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="#" class="nav-btn"><i class="fa-solid fa-compass"></i><span>تصفح</span></a>
    <a href="#" class="nav-btn"><i class="fa-regular fa-bookmark"></i><span>مكتبتي</span></a>
  </div>

</body>
  </html>
