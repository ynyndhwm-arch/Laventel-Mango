<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قارئ الحبر - الرئيسية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0a0b12;
      --bg-card: #141721;
      --accent-orange: #f97316;
      --accent-blue: #2563eb;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border: #232d42;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 16px; padding-bottom: 80px; background-color: var(--bg-main); color: var(--text-main); }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-title { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: var(--bg-card); border: 1px solid var(--border); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    /* Welcome Section */
    .welcome-sub { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 2px; }
    .welcome-main { font-size: 1.6rem; font-weight: bold; margin-bottom: 16px; }

    /* Banner Feature Card */
    .hero-banner {
      position: relative; border-radius: 20px; overflow: hidden; height: 180px;
      margin-bottom: 20px; border: 1px solid var(--border); cursor: pointer;
    }
    .hero-bg { width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,11,18,0.95) 10%, rgba(10,11,18,0.2) 60%, transparent);
      padding: 16px; display: flex; flex-direction: column; justify-content: flex-end;
    }
    .badge-orange {
      align-self: flex-end; background: var(--accent-orange); color: #fff;
      font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 8px; margin-bottom: auto;
    }
    .hero-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 4px; }
    .hero-meta { font-size: 0.8rem; color: var(--text-sub); }

    /* Genre Tags Horizontal Scroll */
    .tags-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; scrollbar-width: none; }
    .tags-scroll::-webkit-scrollbar { display: none; }
    .tag-chip { background: var(--bg-card); border: 1px solid var(--border); color: #e5e7eb; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; white-space: nowrap; }
    .tag-chip.active { background: #1e293b; border-color: #3b82f6; }

    /* Section Title */
    .section-head { font-size: 1.1rem; font-weight: bold; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .section-head i { color: var(--accent-orange); }

    /* Trending Cards Grid */
    .manga-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .manga-card { text-decoration: none; color: inherit; }
    .manga-cover-wrapper { position: relative; width: 100%; height: 150px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
    .manga-cover { width: 100%; height: 100%; object-fit: cover; }
    .badge-new { position: absolute; top: 6px; right: 6px; background: var(--accent-orange); color: #fff; font-size: 0.65rem; font-weight: bold; padding: 2px 6px; border-radius: 6px; }
    .manga-card-title { font-size: 0.8rem; font-weight: bold; margin-top: 6px; text-align: center; }

    /* Bottom Navigation */
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: #090c12; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-btn { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-sub); font-size: 0.75rem; width: 33%; }
    .nav-btn.active { color: var(--accent-orange); }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="icon-btn"><i class="fa-regular fa-bell"></i></div>
    <div class="top-title">قارئ الحبر 🥭</div>
    <div class="icon-btn"><i class="fa-regular fa-user"></i></div>
  </div>

  <!-- Welcome Headers -->
  <div class="welcome-sub">مرحباً بعودتك</div>
  <div class="welcome-main">قارئ الحبر</div>

  <!-- Hero Feature Card -->
  <a href="details.html" class="hero-banner">
    <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600" class="hero-bg">
    <div class="hero-overlay">
      <span class="badge-orange">الأكثر رواقاً</span>
      <div class="hero-title">سيف الفجر</div>
      <div class="hero-meta">أكشن • 142 فصل</div>
    </div>
  </a>

  <!-- Categories Scroll -->
  <div class="tags-scroll">
    <div class="tag-chip active">أكشن</div>
    <div class="tag-chip">خيال</div>
    <div class="tag-chip">رومانسي</div>
    <div class="tag-chip">رعب</div>
    <div class="tag-chip">مغامرة</div>
    <div class="tag-chip">دراما</div>
  </div>

  <!-- Section Title -->
  <div class="section-head">
    <i class="fa-solid fa-fire"></i>
    <span>الأكثر قراءة الآن</span>
  </div>

  <!-- Manga Cards List -->
  <div class="manga-grid">
    <a href="details.html" class="manga-card">
      <div class="manga-cover-wrapper">
        <span class="badge-new">جديد</span>
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400" class="manga-cover">
      </div>
      <div class="manga-card-title">سيف الفجر</div>
    </a>

    <a href="details.html" class="manga-card">
      <div class="manga-cover-wrapper">
        <span class="badge-new">جديد</span>
        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400" class="manga-cover">
      </div>
      <div class="manga-card-title">طريق الألف خطوة</div>
    </a>

    <a href="details.html" class="manga-card">
      <div class="manga-cover-wrapper">
        <span class="badge-new">جديد</span>
        <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400" class="manga-cover">
      </div>
      <div class="manga-card-title">العاصفة الحمراء</div>
    </a>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-bar">
    <a href="index.html" class="nav-btn active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
    <a href="#" class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i><span>تصفح</span></a>
    <a href="#" class="nav-btn"><i class="fa-regular fa-bookmark"></i><span>مكتبتي</span></a>
  </div>

</body>
</html>
