<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قارئ الحبر</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Rakkas&display=swap');
    
    body {
      background: #17140F;
      color: #F0E9DC;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      margin: 0;
      padding: 0;
    }
    .font-display { font-family: 'Rakkas', serif; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #3a332a; border-radius: 3px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <div id="app" class="min-h-screen w-full flex flex-col">
    <!-- المحتوى يتغير هنا بناءً على الصفحة -->
    <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-24"></main>
    
    <!-- شريط التنقل السفلي -->
    <div id="bottom-nav" class="fixed bottom-0 inset-x-0 h-16 flex items-center justify-around border-t border-[#2A241C]" style="background: #120F0B">
      <button onclick="setView('home')" id="nav-home" class="flex flex-col items-center gap-1 text-xs">
        <i data-lucide="home" class="w-5 h-5"></i><span>الرئيسية</span>
      </button>
      <button onclick="setView('search')" id="nav-search" class="flex flex-col items-center gap-1 text-xs">
        <i data-lucide="search" class="w-5 h-5"></i><span>تصفح</span>
      </button>
      <button onclick="setView('library')" id="nav-library" class="flex flex-col items-center gap-1 text-xs">
        <i data-lucide="bookmark" class="w-5 h-5"></i><span>مكتبتي</span>
      </button>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // البيانات
    // ---------------------------------------------------------------------------
    const GENRES = ["أكشن", "خيال", "رومانسية", "رعب", "مغامرة", "دراما", "كوميديا"];
    const COVER_PALETTES = [
      ["#7A1F2B", "#2A0D12"], ["#1F3B4D", "#0A1620"], ["#4B3B78", "#1A1230"],
      ["#3D5A2C", "#12200C"], ["#8A5A21", "#2B1A05"], ["#6B2440", "#210B14"],
      ["#22515A", "#081A1D"], ["#5A3921", "#1C1006"],
    ];

    const SEED_TITLES = [
      { title: "سيف الفجر", genre: "أكشن", ch: 142, rating: 4.8, hot: true },
      { title: "ظل التنين الأخير", genre: "خيال", ch: 88, rating: 4.6, hot: true },
      { title: "همسات القمر", genre: "رومانسية", ch: 54, rating: 4.9, hot: false },
      { title: "صائد الأرواح", genre: "رعب", ch: 71, rating: 4.5, hot: true },
      { title: "طريق الألف خطوة", genre: "مغامرة", ch: 210, rating: 4.7, hot: false },
      { title: "العاصفة الحمراء", genre: "أكشن", ch: 175, rating: 4.9, hot: true },
    ];

    const mangas = SEED_TITLES.map((t, i) => ({
      id: i + 1,
      ...t,
      palette: COVER_PALETTES[i % COVER_PALETTES.length],
      synopsis: "في عالمٍ يتصارع فيه الضوء والظل، يخوض بطلنا رحلة محفوفة بالمخاطر بحثاً عن حقيقة ماضیه، وسط تحالفات هشّة وأعداء لا يرحمون.",
      author: "استوديو حبر",
      status: i % 3 === 0 ? "مكتملة" : "مستمرة",
      views: "45 ألف",
      ageWarning: "ربما يحتوي هذا العمل على مشاهد غير مناسبة للقصر، لذلك وجب التنويه."
    }));

    // ---------------------------------------------------------------------------
    // الحالة (State)
    // ---------------------------------------------------------------------------
    let currentView = 'home';
    let activeMangaId = null;
    let query = '';
    let genreFilter = null;
    let favorites = new Set();

    // ---------------------------------------------------------------------------
    // وظائف مساعدة
    // ---------------------------------------------------------------------------
    function getCoverArtHTML(palette, seed, className) {
      return `
        <div class="relative overflow-hidden ${className}" style="background: linear-gradient(160deg, ${palette[0]} 0%, ${palette[1]} 100%)">
          <div class="absolute inset-0 opacity-30" style="background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 14px)"></div>
          <div class="absolute rounded-full" style="width: 90px; height: 90px; right: ${-20 + (seed % 3) * 10}px; top: ${-20 + (seed % 4) * 8}px; background: rgba(255,255,255,0.10)"></div>
          <div class="absolute inset-x-0 bottom-0 h-1/2" style="background: linear-gradient(0deg, ${palette[1]}CC 0%, transparent 100%)"></div>
        </div>`;
    }

    // ---------------------------------------------------------------------------
    // التحكم بالتنقل والبيانات
    // ---------------------------------------------------------------------------
    function setView(view) {
      currentView = view;
      if (view !== 'search') query = ''; // إعادة ضبط البحث عند الخروج
      render();
    }

    function openManga(id) {
      activeMangaId = id;
      setView('manga');
    }

    function toggleFavorite(event, id) {
      event.stopPropagation();
      if (favorites.has(id)) favorites.delete(id);
      else favorites.add(id);
      render(); // تحديث الواجهة
    }

    function setGenre(genre) {
      genreFilter = genreFilter === genre ? null : genre;
      setView('search');
    }

    function handleSearch(event) {
      query = event.target.value.toLowerCase();
      document.getElementById('search-results').innerHTML = getSearchResultsHTML();
      lucide.createIcons();
    }

    function getSearchResultsHTML() {
      const results = mangas.filter(m => {
        const matchesQuery = m.title.toLowerCase().includes(query);
        const matchesGenre = !genreFilter || m.genre === genreFilter;
        return matchesQuery && matchesGenre;
      });

      if (results.length === 0) return `<p class="col-span-3 text-center text-sm opacity-50 mt-10">لا توجد نتائج مطابقة لبحثك</p>`;

      return results.map(m => `
        <button onclick="openManga(${m.id})" class="text-right">
          ${getCoverArtHTML(m.palette, m.id, 'w-full h-32 rounded-lg')}
          <p class="text-xs font-semibold mt-1.5 truncate">${m.title}</p>
          <p class="text-[10px] opacity-55">${m.ch} فصل</p>
        </button>
      `).join('');
    }

    // ---------------------------------------------------------------------------
    // التصيير (Rendering)
    // ---------------------------------------------------------------------------
    function render() {
      const main = document.getElementById('main-content');
      
      // تحديث ألوان الشريط السفلي
      document.querySelectorAll('#bottom-nav button').forEach(btn => btn.classList.replace('text-[#C1440E]', 'opacity-60'));
      if(currentView === 'home' || currentView === 'search' || currentView === 'library') {
         document.getElementById(`nav-${currentView}`).classList.replace('opacity-60', 'text-[#C1440E]');
      }

      if (currentView === 'home') {
        const featured = mangas[0];
        const trending = mangas.filter(m => m.hot);
        const latest = [...mangas].sort((a, b) => b.ch - a.ch).slice(0, 6);

        main.innerHTML = `
          <div class="flex items-center justify-between px-4 pt-5 pb-3">
            <div>
              <p class="text-xs opacity-60">مرحباً بعودتك</p>
              <h1 class="text-2xl font-bold leading-none mt-1">قارئ الحبر 🥭</h1>
            </div>
            <button class="w-9 h-9 rounded-full flex items-center justify-center bg-[#2A241C]">
              <i data-lucide="bell" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="px-4">
            <button onclick="openManga(${featured.id})" class="relative w-full h-44 rounded-2xl overflow-hidden text-right block">
              ${getCoverArtHTML(featured.palette, 1, 'absolute inset-0')}
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
              <div class="absolute bottom-0 right-0 p-4 w-full">
                <span class="inline-flex items-center justify-center rounded-full text-[10px] font-bold px-2 py-0.5 text-[#F0E9DC] bg-[#B3331D]">الأكثر رواجاً</span>
                <h2 class="text-2xl font-bold mt-2">${featured.title}</h2>
                <p class="text-xs opacity-80 mt-1">${featured.genre} · ${featured.ch} فصل</p>
              </div>
            </button>
          </div>

          <div class="flex gap-2 overflow-x-auto no-scrollbar px-4 mt-4">
            ${GENRES.map(g => `<button onclick="setGenre('${g}')" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#2A241C] text-[#E4D9C4]">${g}</button>`).join('')}
          </div>

          <div class="mt-6">
            <div class="flex items-center gap-1.5 px-4 mb-3">
              <i data-lucide="flame" class="w-4 h-4 text-[#C1440E]"></i><h3 class="text-sm font-bold">الأكثر قراءة الآن</h3>
            </div>
            <div class="flex gap-3 overflow-x-auto no-scrollbar px-4">
              ${trending.map(m => `
                <div class="w-28 shrink-0">
                  <button onclick="openManga(${m.id})" class="relative block w-28 h-40 rounded-xl overflow-hidden">
                    ${getCoverArtHTML(m.palette, m.id, 'absolute inset-0')}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
                    <span class="absolute top-1.5 right-1.5 inline-flex items-center justify-center rounded-full text-[10px] font-bold px-2 py-0.5 text-[#F0E9DC] bg-[#B3331D]">جديد</span>
                    <button onclick="toggleFavorite(event, ${m.id})" class="absolute top-1.5 left-1.5 w-6 h-6 rounded-full flex items-center justify-center bg-black/40">
                      <i data-lucide="heart" class="w-3 h-3 ${favorites.has(m.id) ? 'text-[#C1440E] fill-[#C1440E]' : 'text-[#F0E9DC]'}"></i>
                    </button>
                    <div class="absolute bottom-1.5 right-1.5 flex items-center gap-0.5">
                      <i data-lucide="star" class="w-2.5 h-2.5 text-[#E3B34C] fill-[#E3B34C]"></i>
                      <span class="text-[10px] font-medium">${m.rating}</span>
                    </div>
                  </button>
                  <p class="text-xs font-semibold mt-1.5 truncate">${m.title}</p>
                  <p class="text-[10px] opacity-55">${m.genre}</p>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="mt-6">
            <div class="flex items-center gap-1.5 px-4 mb-3">
              <i data-lucide="clock" class="w-4 h-4 text-[#C1440E]"></i><h3 class="text-sm font-bold">تحديثات جديدة</h3>
            </div>
            <div class="flex flex-col gap-2 px-4">
              ${latest.map(m => `
                <button onclick="openManga(${m.id})" class="flex items-center gap-3 rounded-xl p-2 text-right bg-[#201B14]">
                  ${getCoverArtHTML(m.palette, m.id, 'w-12 h-16 rounded-lg shrink-0')}
                  <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold truncate">${m.title}</p>
                    <p class="text-xs opacity-60 mt-0.5">الفصل ${m.ch} · ${m.genre}</p>
                  </div>
                  <i data-lucide="chevron-left" class="w-4 h-4 opacity-50"></i>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      } 
      else if (currentView === 'search') {
        main.innerHTML = `
          <div class="px-4 pt-5">
            <h1 class="text-2xl font-bold mb-3">تصفّح المانجا</h1>
            <div class="flex items-center gap-2 rounded-xl px-3 py-2.5 bg-[#221D16]">
              <i data-lucide="search" class="w-4 h-4 opacity-60"></i>
              <input type="text" onkeyup="handleSearch(event)" value="${query}" placeholder="ابحث عن قصة، بطل، أو عالم..." class="bg-transparent outline-none flex-1 text-sm placeholder:opacity-50">
            </div>

            <div class="flex gap-2 overflow-x-auto no-scrollbar mt-3">
              <button onclick="setGenre(null)" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium ${!genreFilter ? 'bg-[#C1440E] text-[#17140F]' : 'bg-[#2A241C] text-[#E4D9C4]'}">الكل</button>
              ${GENRES.map(g => `<button onclick="setGenre('${g}')" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium ${genreFilter === g ? 'bg-[#C1440E] text-[#17140F]' : 'bg-[#2A241C] text-[#E4D9C4]'}">${g}</button>`).join('')}
            </div>

            <div id="search-results" class="grid grid-cols-3 gap-3 mt-4">
              ${getSearchResultsHTML()}
            </div>
          </div>
        `;
      }
      else if (currentView === 'library') {
        const list = mangas.filter(m => favorites.has(m.id));
        let content = '';
        if (list.length === 0) {
          content = `
            <div class="text-center mt-16">
              <i data-lucide="bookmark" class="w-8 h-8 opacity-30 mx-auto mb-3"></i>
              <p class="text-sm opacity-60">مكتبتك فارغة حالياً</p>
            </div>`;
        } else {
          content = `<div class="flex flex-col gap-2">` + list.map(m => `
            <div class="flex items-center gap-3 rounded-xl p-2 bg-[#201B14]">
              <button onclick="openManga(${m.id})" class="shrink-0">${getCoverArtHTML(m.palette, m.id, 'w-12 h-16 rounded-lg')}</button>
              <button onclick="openManga(${m.id})" class="flex-1 min-w-0 text-right">
                <p class="text-sm font-semibold truncate">${m.title}</p>
                <p class="text-xs opacity-60 mt-0.5">حتى الفصل ${m.ch}</p>
              </button>
              <button onclick="toggleFavorite(event, ${m.id})" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 bg-[#2A241C]">
                <i data-lucide="heart" class="w-3.5 h-3.5 text-[#C1440E] fill-[#C1440E]"></i>
              </button>
            </div>
          `).join('') + `</div>`;
        }

        main.innerHTML = `
          <div class="px-4 pt-5">
            <h1 class="text-2xl font-bold mb-1">مكتبتي</h1>
            <p class="text-xs opacity-55 mb-4">القصص المحفوظة للمتابعة لاحقاً</p>
            ${content}
          </div>
        `;
      }
      else if (currentView === 'manga' && activeMangaId) {
        const manga = mangas.find(m => m.id === activeMangaId);
        main.innerHTML = `
          <div class="px-4 pt-4">
            <div class="flex justify-between items-center mb-4">
              <button onclick="setView('home')" class="p-2 rounded-full bg-[#201B14]"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
              <button onclick="toggleFavorite(event, ${manga.id})" class="p-2 rounded-full bg-[#201B14]">
                <i data-lucide="heart" class="w-4 h-4 ${favorites.has(manga.id) ? 'text-[#C1440E] fill-[#C1440E]' : 'text-[#F0E9DC]'}"></i>
              </button>
            </div>

            <div class="grid grid-cols-[1fr_110px] gap-3 items-start mb-4">
              <div>
                <h1 class="text-2xl font-bold mb-2">${manga.title}</h1>
                <p class="text-xs opacity-60 mb-1">حالة القصة: ${manga.status}</p>
                <p class="text-xs opacity-60 mb-1">المؤلف: ${manga.author}</p>
                <p class="text-xs opacity-60">التصنيف: ${manga.genre}</p>
              </div>
              ${getCoverArtHTML(manga.palette, manga.id, 'w-[110px] h-[155px] rounded-xl shadow-lg')}
            </div>

            <p class="text-xs leading-relaxed opacity-80 mb-4">${manga.synopsis}</p>

            <div class="bg-red-950/40 border border-red-800/40 rounded-xl p-3 flex items-center gap-3 mb-4 text-xs text-red-200">
              <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0 text-red-500"></i>
              <p>${manga.ageWarning}</p>
            </div>

            <button onclick="alert('سيتم إضافة قارئ الفصول قريباً!')" class="w-full py-3 rounded-xl font-bold text-center block mb-4 bg-[#C1440E] text-[#F0E9DC]">
              قراءة الفصل الأول
            </button>
          </div>
        `;
      }

      // تشغيل أيقونات Lucide بعد كل تحديث للواجهة
      lucide.createIcons();
    }

    // التهيئة الأولى عند تحميل الصفحة
    render();
  </script>
</body>
  </html>
