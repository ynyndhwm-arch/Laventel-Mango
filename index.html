<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مانجو لافنتيل - Laventel Mango</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --accent: #8a2be2; --text: #ffffff; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: var(--accent); }
    .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
    input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    button { background: var(--accent); font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }
    .chapter-item { border-bottom: 1px solid #333; padding: 12px 0; }
    .manga-img { max-width: 100%; display: block; margin: 10px 0; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>مانجو لافنتيل 🥭</h1>

  <div class="card">
    <h3>إضافة فصل جديد (لوحة الإدارة)</h3>
    <input type="text" id="chapterTitle" placeholder="اسم العمل / المانجا">
    <input type="number" id="chapterNum" placeholder="رقم الفصل (مثال: 1)">
    <textarea id="imagesUrls" rows="4" placeholder="روابط الصور (ضع كل رابط في سطر جديد)"></textarea>
    <button onclick="uploadChapter()">نشر الفصل</button>
  </div>

  <div class="card">
    <h3>أحدث الفصول</h3>
    <div id="chaptersList">جاري تحميل الفصول...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://dcdmntpjpjnsftumspvg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-FAbp6w52_4Un8PWa0pgbg_gpRnYpFk';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadChapters() {
    const list = document.getElementById('chaptersList');
    const { data, error } = await db.from('chapters').select('*').order('chapter_number', { ascending: false });
    
    if (error) { list.innerHTML = 'حدث خطأ أثناء تحميل الفصول.'; return; }
    if (!data.length) { list.innerHTML = 'لا توجد فصول مرفوعة حالياً.'; return; }

    list.innerHTML = data.map(ch => `
      <div class="chapter-item">
        <h4>${ch.title} - الفصل ${ch.chapter_number}</h4>
        <div>
          ${ch.images_urls.map(url => `<img src="${url}" class="manga-img" loading="lazy">`).join('')}
        </div>
      </div>
    `).join('');
  }

  async function uploadChapter() {
    const title = document.getElementById('chapterTitle').value.trim();
    const chapter_number = document.getElementById('chapterNum').value;
    const rawUrls = document.getElementById('imagesUrls').value.trim();

    if (!title || !chapter_number || !rawUrls) {
      alert('يرجى ملء جميع الحقول!');
      return;
    }

    const images_urls = rawUrls.split('\n').map(u => u.trim()).filter(u => u !== '');

    const { error } = await db.from('chapters').insert([{ title, chapter_number, images_urls }]);

    if (error) {
      alert('خطأ أثناء النشر: ' + error.message);
    } else {
      alert('تم نشر الفصل بنجاح!');
      document.getElementById('chapterTitle').value = '';
      document.getElementById('chapterNum').value = '';
      document.getElementById('imagesUrls').value = '';
      loadChapters();
    }
  }

  loadChapters();
</script>

</body>
</html>
