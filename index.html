<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>Vertical Manga Reader</title>

  <!-- React & React DOM CDN -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<body class="bg-gray-900 text-white min-h-screen">
